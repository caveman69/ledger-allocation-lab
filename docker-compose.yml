# Local SQL Server for the integration tests. Nothing here leaves your machine.
# Usage (from app/):  copy .env.example .env, set a password, then  docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ledgerlab-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/.env}"
    ports:
      # Bound to IPv4 loopback only: reachable from this machine, not from the network.
      # Connect with 127.0.0.1,14333 (not localhost, which may resolve to IPv6 on Windows).
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    volumes:
      - ledgerlab-sql-data:/var/opt/mssql
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ledgerlab-sql-data:
